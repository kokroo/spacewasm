name: 32/64-bit tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
        profile:
          - debug
          - release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 32-bit system libraries
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          WABT_VERSION=1.0.41
          wget -q https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-linux-x64.tar.gz
          tar -xzf wabt-${WABT_VERSION}-linux-x64.tar.gz
          sudo cp wabt-${WABT_VERSION}/bin/* /usr/local/bin/

      # Only the interpreter library runs on the target device; the workspace
      # tooling crates are host-only, so the 32-bit matrix exercises `spacewasm`.
      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test -p spacewasm --target ${{ matrix.target }} --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test -p spacewasm --release --target ${{ matrix.target }} --verbose
